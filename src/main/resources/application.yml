server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: edu-system-backend
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    driver-class-name: com.zjut.edusystem.config.OpenGaussAliasDriver
    url: ${DB_URL:jdbc:opengauss://x6.sjcmc.cn:34003/postgres?user=sht&password=@Sht20051229}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: "${REDIS_PASSWORD:@Sht20051229}"
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

edu-system:
  redis:
    ssh:
      enabled: ${REDIS_SSH_ENABLED:true}
      host: ${REDIS_SSH_HOST:111.228.45.195}
      port: ${REDIS_SSH_PORT:22}
      username: ${REDIS_SSH_USERNAME:root}
      password: "${REDIS_SSH_PASSWORD:@Sht20051229}"
      local-host: ${REDIS_SSH_LOCAL_HOST:127.0.0.1}
      local-port: ${REDIS_SSH_LOCAL_PORT:6380}
      remote-host: ${REDIS_SSH_REMOTE_HOST:127.0.0.1}
      remote-port: ${REDIS_SSH_REMOTE_PORT:6379}
      connect-timeout-ms: ${REDIS_SSH_CONNECT_TIMEOUT_MS:10000}
  upload:
    image-dir: ${IMAGE_UPLOAD_DIR:uploads/image}
    public-base-url: ${PUBLIC_BASE_URL:http://x6.sjcmc.cn:34084}
    remote:
      enabled: ${REMOTE_UPLOAD_ENABLED:true}
      upload-url: ${REMOTE_UPLOAD_URL:http://x6.sjcmc.cn:34084/image-upload/}
      username: ${REMOTE_UPLOAD_USER:}
      password: ${REMOTE_UPLOAD_PASSWORD:}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  selection:
    available-cache:
      enabled: ${SELECTION_AVAILABLE_CACHE_ENABLED:true}
      preheat-minutes: ${SELECTION_AVAILABLE_CACHE_PREHEAT_MINUTES:5}
      scan-interval-ms: ${SELECTION_AVAILABLE_CACHE_SCAN_INTERVAL_MS:15000}
      initial-delay-ms: ${SELECTION_AVAILABLE_CACHE_INITIAL_DELAY_MS:5000}
      catalog-ttl-seconds: ${SELECTION_AVAILABLE_CACHE_TTL_SECONDS:604800}
      round-ttl-seconds: ${SELECTION_ROUND_CACHE_TTL_SECONDS:5}
